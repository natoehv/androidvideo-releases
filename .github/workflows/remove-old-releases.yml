name: Delete old releases

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  delete-old-releases:
    runs-on: ubuntu-latest

    steps:
      - name: Delete old releases
        uses: dev-drprasad/delete-older-releases@v0.3.4
        with:
          keep_latest: 3
          keep_min_download_counts: 1
          delete_expired_data: 10
          delete_tag_pattern: beta
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
