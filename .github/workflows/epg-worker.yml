name: EPG y guía (worker)

# FASE 1 del plan del worker (docs/PLAN_CLOUD_WORKER.md, en el repo del código).
#
# Arma la ventana de EPG y la sube a `config/iptv/epg/w1`, que es EL MISMO documento que la app ya lee
# (`IptvEpgCloud`). O sea: esto no agrega una función nueva, ocupa el lugar del escritor que hoy falta.
# Medido: armar la ventana cuesta bajar decenas de MB de XML, y en un box de gama baja ese trabajo le compite
# al reproductor —por eso en TV la ingesta local está desactivada a propósito y el EPG dependía de que
# alguien abriera el teléfono—. Con esto, ningún aparato baja el XML nunca.
#
# ─── SOBRE LO QUE SE VE (repo público) ──────────────────────────────────────────────────────────────────
# El archivo y los logs son públicos y no hay ajuste para ocultarlos. Por eso:
#  · El código sale del repo PRIVADO con una deploy key de sólo lectura, y `persist-credentials: false`
#    para que no quede escrita en `.git/config` del runner.
#  · La salida de Gradle va a un archivo y NO se imprime: un error de compilación imprimiría rutas y
#    líneas del código privado.
#  · El worker nunca imprime la URL de un panel (lleva usuario y contraseña); sólo agregados.
#  · Contra Google se autentica con Workload Identity Federation: no hay ninguna llave de larga vida.

on:
  workflow_dispatch:
  schedule:
    # Cada 6 h. La ventana es de 36 h, así que aguanta tres corridas salteadas (los crons son best-effort).
    - cron: '23 */6 * * *'

concurrency:
  group: epg-worker
  cancel-in-progress: false

permissions:
  # Imprescindible para WIF: es el token OIDC que Google cambia por uno de acceso. Sin esto el paso de
  # autenticación falla con "missing id-token permission".
  id-token: write
  contents: read

jobs:
  epg:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # Sin esto el fallo MIENTE: cuando `ssh-key` llega vacío, checkout no avisa — se cae al GITHUB_TOKEN,
      # que no ve el repo privado, y el error es "Repository not found", que manda a buscar el repo o los
      # permisos de la deploy key en vez del secreto que falta.
      - name: Comprobar que la deploy key está cargada
        env:
          KEY: ${{ secrets.CODE_DEPLOY_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "Falta el secreto CODE_DEPLOY_KEY en ESTE repo (androidvideo-releases)."
            echo "  · Settings → Secrets and variables → Actions → pestaña Secrets (no Variables)"
            echo "  · Nombre exacto: CODE_DEPLOY_KEY"
            echo "  · Contenido: la clave PRIVADA (el archivo sin .pub), entera y con su última línea"
            exit 1
          fi
          echo "CODE_DEPLOY_KEY presente (${#KEY} caracteres)."
          case "$KEY" in
            *"OPENSSH PRIVATE KEY"*) echo "Formato OpenSSH, correcto." ;;
            *"ssh-ed25519 "*) echo "OJO: parece la clave PÚBLICA, no la privada." ; exit 1 ;;
            *) echo "OJO: no parece una clave privada OpenSSH." ; exit 1 ;;
          esac

      - name: Traer el código (repo privado, deploy key de sólo lectura)
        uses: actions/checkout@v4
        with:
          repository: natoehv/trst_android
          # `ref` EXPLÍCITO, no es adorno: sin él, checkout resuelve la rama por defecto llamando a la API
          # REST con el GITHUB_TOKEN de este repo, que no ve el privado → "Not Found" aunque el SSH esté
          # perfecto. Con `ref` puesto, ese paso no corre y todo va por git sobre SSH.
          ref: main
          ssh-key: ${{ secrets.CODE_DEPLOY_KEY }}
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # 25, no 17: es el JDK con el que este proyecto compila de verdad (el JBR de Android Studio, ver
          # docs/notes/build.md). `:iptv-core` genera bytecode 17 igual, pero la CONFIGURACIÓN del módulo
          # Android exige el JDK que espera AGP 9.
          java-version: '25'

      # ── CACHÉ DEL JAR ────────────────────────────────────────────────────────────────────────────────
      # La ventana de EPG cambia cada 6 h; el CÓDIGO del worker, casi nunca. Así que se cachea el jar ya
      # construido con una clave que es el hash de las fuentes que lo determinan: si no cambió nada, la
      # corrida se salta Gradle, el SDK de Android y la compilación entera —de ~4 min a menos de uno— y
      # queda sólo bajar las grillas, que es el trabajo de verdad.
      #
      # Los cachés de un PR de un fork quedan aislados en la rama de ese PR y `main` no los puede leer, así
      # que un fork no puede dejar un jar envenenado acá.
      - name: ¿Ya existe el jar de este código?
        id: jar
        uses: actions/cache@v4
        with:
          path: iptv-core/build/libs/worker.jar
          key: >-
            worker-jar-${{ hashFiles('iptv-core/**/*.kt', 'iptv-core/build.gradle.kts',
            'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties',
            'settings.gradle.kts', 'build.gradle.kts') }}

      # Hace falta aunque sólo se compile `:iptv-core`, que es Kotlin/JVM puro: Gradle CONFIGURA todos los
      # módulos del build, y `:composeApp` es Android y exige el SDK en la configuración.
      - uses: android-actions/setup-android@v3
        if: steps.jar.outputs.cache-hit != 'true'

      - uses: gradle/actions/setup-gradle@v4
        if: steps.jar.outputs.cache-hit != 'true'

      - name: Compilar el worker (salida a archivo, ver el encabezado)
        if: steps.jar.outputs.cache-hit != 'true'
        run: |
          # `--build-cache`: incluso cuando el jar no está cacheado, las tareas cuyas entradas no cambiaron
          # salen del caché de build que `setup-gradle` persiste, en vez de recompilarse.
          # `in-process`: la estrategia que este proyecto usa siempre (ver docs/notes/build.md), para no
          # depender de que el daemon de Kotlin arranque bien.
          if ! ./gradlew :iptv-core:workerJar --no-daemon --build-cache \
                 -Pkotlin.compiler.execution.strategy=in-process > gradle.log 2>&1; then
            echo "La compilación falló. El log completo NO se imprime porque este repo es público."
            echo "--- Qué falló (sin líneas del compilador, que llevarían código) ---"
            # Del bloque "What went wrong" hasta "Try:", que es donde Gradle dice la CAUSA (SDK que falta,
            # dependencia que no resuelve, JDK incompatible). Se filtran las líneas del compilador de Kotlin
            # (`e: file:///...`) y cualquier referencia a un .kt, que sí llevarían nombres del código.
            sed -n "/What went wrong/,/^\* Try:/p" gradle.log \
              | grep -vE "^e: |\.kt[:\)]|\.kts[:\)]" | head -30
            echo "--- Tareas ejecutadas ---"
            grep -oE "^> Task :[a-zA-Z0-9:_-]+" gradle.log | tail -10
            exit 1
          fi
          ls -l iptv-core/build/libs/worker.jar

      - name: El jar salió del caché
        if: steps.jar.outputs.cache-hit == 'true'
        run: ls -l iptv-core/build/libs/worker.jar

      - name: Autenticar contra Google (WIF, sin llaves)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: android-video-7bdcc
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SA }}
          token_format: access_token

      - name: Armar y subir la ventana de EPG
        env:
          FIRESTORE_PROJECT: android-video-7bdcc
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: java -jar iptv-core/build/libs/worker.jar --tarea=epg --horas=36

      # En el MISMO job: el checkout, el jar y el token ya están pagados, y son dos trabajos que van juntos
      # (los dos leen los catálogos de las mismas listas). `if: always()` porque son independientes: que un
      # panel rompa la ingesta del EPG no es razón para quedarse sin guía.
      - name: Armar y subir la guía curada
        if: always()
        env:
          FIRESTORE_PROJECT: android-video-7bdcc
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: java -jar iptv-core/build/libs/worker.jar --tarea=guia
